name: carbon_connect
description: A P2P Carbon Credit trading app.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  supabase_flutter: ^2.4.0
  fl_chart: ^0.66.2
  razorpay_flutter: ^1.3.6
  local_auth: ^2.3.0
  image_picker: ^1.0.7
  flutter_secure_storage: ^9.2.4
  dio: ^5.4.1
  google_fonts: ^6.3.3
  intl: ^0.20.2

  url_launcher: any
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  candlesticks: ^3.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
